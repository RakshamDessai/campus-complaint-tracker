  <text x="325" y="605" fill="#0F172A" font-size="13" font-weight="700">Schema Relational Dependency Proof:</text>
  <text x="325" y="630" fill="#475569" font-size="12.5">• <tspan font-family="monospace">Category(Category_ID PK, Category_Name, SLA_Days, Dept_ID FK -> Department.Dept_ID)</tspan></text>
  <text x="325" y="652" fill="#475569" font-size="12.5">• Modifying <tspan font-weight="700">SLA_Days</tspan> here instantly recalculates turnaround targets for all newly filed complaints without modifying complaint rows.</text>
  <text x="325" y="674" fill="#475569" font-size="12.5">• Transitive dependency avoided: Complaint stores only <tspan font-family="monospace">Category_ID</tspan>, deriving <tspan font-family="monospace">Dept_ID</tspan> via join, keeping schema in 3NF/BCNF.</text>

