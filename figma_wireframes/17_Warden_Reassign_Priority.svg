<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F4F7FA"/>
  <!-- Sidebar Navigation -->
  <g id="Sidebar">
    <rect x="0" y="0" width="240" height="900" fill="#0F2537"/>
    <!-- Brand / Logo -->
    <rect x="24" y="24" width="36" height="36" rx="8" fill="#1F4E79"/>
    <path d="M34 42L42 34M42 34L50 42M42 34V48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" fill="#FFFFFF" font-size="15" font-weight="700">CAMPUS TRACKER</text>
    <text x="68" y="52" fill="#7E92A2" font-size="11" font-weight="500">HOSTEL WARDEN</text>
    <line x1="20" y1="72" x2="220" y2="72" stroke="#1E384D" stroke-width="1"/>
    <!-- Nav Item -->
    <text x="36" y="120" fill="#A0B0BF" font-size="13.5" font-weight="500">Hostel Grievances</text>
    <!-- Nav Item -->
    <text x="36" y="168" fill="#A0B0BF" font-size="13.5" font-weight="500">Assign Staff</text>
    <!-- Active Nav Item -->
    <rect x="12" y="191" width="216" height="40" rx="6" fill="#1F4E79"/>
    <rect x="12" y="191" width="4" height="40" rx="2" fill="#60A5FA"/>
    <text x="36" y="216" fill="#FFFFFF" font-size="13.5" font-weight="600">SLA Escalations</text>
    <!-- Nav Item -->
    <text x="36" y="264" fill="#A0B0BF" font-size="13.5" font-weight="500">Hostel Rooms</text>
    <!-- Nav Item -->
    <text x="36" y="312" fill="#A0B0BF" font-size="13.5" font-weight="500">Reports</text>
    <!-- Bottom Session / Database Info -->
    <rect x="16" y="820" width="208" height="60" rx="8" fill="#183348"/>
    <circle cx="36" cy="850" r="6" fill="#10B981"/>
    <text x="50" y="846" fill="#FFFFFF" font-size="11.5" font-weight="600">DB State Machine</text>
    <text x="50" y="862" fill="#8EA3B5" font-size="10.5">Enforcing 14 FRs &amp; SLAs</text>
  </g>
  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="240" y="0" width="1200" height="70" fill="#FFFFFF"/>
    <line x1="240" y1="70" x2="1440" y2="70" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="272" y="32" fill="#64748B" font-size="11.5" font-weight="500">Home / Portal</text>
    <text x="272" y="52" fill="#0F172A" font-size="18" font-weight="700">Emergency Reassignment &amp; Priority Override</text>
    
    <!-- Search Bar -->
    <rect x="720" y="16" width="300" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="740" cy="35" r="5" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="744" y1="39" x2="750" y2="45" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="758" y="39" fill="#94A3B8" font-size="12">Search complaints, tickets, IDs...</text>
    
    <!-- Notification Bell -->
    <circle cx="1060" cy="35" r="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <path d="M1057 32C1057 30 1059 28 1060 28C1061 28 1063 30 1063 32V36L1065 38H1055L1057 36V32Z" stroke="#475569" stroke-width="1.5"/>
    <circle cx="1066" cy="27" r="4" fill="#EF4444"/>
    
    <!-- User Profile Badge -->
    <circle cx="1120" cy="35" r="18" fill="#1F4E79"/>
    <text x="1120" y="40" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">DR</text>
    <text x="1148" y="33" fill="#0F172A" font-size="13" font-weight="600">Dr. Ramesh Sharma</text>
    <rect x="1148" y="40" width="70" height="18" rx="4" fill="#E2E8F0"/>
    <text x="1183" y="53" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">WARDEN (Nilkanth Hostel)</text>
  </g>

  <!-- Card Container -->
  <rect x="270" y="95" width="1115" height="750" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <text x="310" y="140" fill="#0F172A" font-size="20" font-weight="800">Reassign #CMP-099 &amp; Preserve Assignment Audit History</text>
  <text x="310" y="162" fill="#64748B" font-size="13">Previous staff assignment will be stamped with <tspan font-family="monospace">Unassigned_At = NOW()</tspan> rather than overwritten (M:N design).</text>
  <line x1="310" y1="180" x2="1340" y2="180" stroke="#E2E8F0"/>

  <!-- Previous Assignment Record -->
  <rect x="310" y="205" width="1010" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="330" y="235" fill="#64748B" font-size="11.5" font-weight="700">PREVIOUS TECHNICIAN RECORD (IN Staff_Assignment)</text>
  <text x="330" y="260" fill="#0F172A" font-size="14" font-weight="700">Technician Kumar (STF-02) • Electrician</text>
  <text x="330" y="278" fill="#475569" font-size="12">Assigned_At: Oct 11, 2026, 10:30 AM • Reason for Reassignment: Medical leave / Inactivity SLA breach</text>

  <!-- New Senior Specialist Selector -->
  <text x="310" y="325" fill="#334155" font-size="12" font-weight="700">REASSIGN TO SENIOR TECHNICIAN *</text>
  <rect x="310" y="335" width="1010" height="44" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="330" y="362" fill="#0F172A" font-size="13.5">Senior Tech. Robert Vance (STF-01) — Lead Electrical Engineer</text>
  <path d="M1290 354L1297 361L1304 354" stroke="#1F4E79" stroke-width="2"/>

  <!-- Priority Override -->
  <text x="310" y="415" fill="#334155" font-size="12" font-weight="700">OVERRIDE TICKET PRIORITY LEVEL *</text>
  <rect x="310" y="425" width="230" height="42" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="425" y="451" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">🚨 CRITICAL PRIORITY</text>

  <rect x="560" y="425" width="210" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="665" y="451" fill="#475569" font-size="13" text-anchor="middle">High Priority</text>

  <rect x="790" y="425" width="210" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="895" y="451" fill="#475569" font-size="13" text-anchor="middle">Standard</text>

  <!-- Urgent Remarks -->
  <text x="310" y="500" fill="#334155" font-size="12" font-weight="700">SUPERVISOR REASSIGNMENT MEMO (RECORDED IN AUDIT LOG) *</text>
  <rect x="310" y="510" width="1010" height="95" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="535" fill="#0F172A" font-size="13">Compressor breaker trip represents residential water shortage and fire safety concern. Assigned to Senior Lead Robert with instructions to replace overload relay today.</text>

  <!-- Submit Buttons -->
  <line x1="310" y1="635" x2="1320" y2="635" stroke="#E2E8F0"/>
  <rect x="310" y="655" width="310" height="48" rx="8" fill="#1F4E79"/>
  <text x="465" y="685" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Confirm Reassignment in DB →</text>
  
  <rect x="640" y="655" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="700" y="685" fill="#475569" font-size="14" font-weight="600" text-anchor="middle">Cancel</text>

</svg>