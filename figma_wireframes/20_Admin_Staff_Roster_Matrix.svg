  <text x="320" y="318" fill="#1F4E79" font-size="13" font-weight="700" font-family="monospace">STF-04</text>
  <text x="410" y="318" fill="#0F172A" font-size="13" font-weight="600">John Doe</text>
  <text x="590" y="318" fill="#475569" font-size="13">Electrician Specialist</text>
  <text x="790" y="318" fill="#475569" font-size="13">Estate Maintenance</text>
  <text x="970" y="318" fill="#B45309" font-size="13" font-weight="700">4 Active Tickets</text>
  <rect x="1140" y="305" width="85" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="1182" y="321" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">Near Capacity</text>
  <text x="1290" y="318" fill="#1F4E79" font-size="12" font-weight="600">Inspect</text>

  <!-- Row 2: Alex Green -->
  <line x1="300" y1="395" x2="1355" y2="395" stroke="#F1F5F9"/>
  <text x="320" y="373" fill="#1F4E79" font-size="13" font-weight="700" font-family="monospace">STF-06</text>
  <text x="410" y="373" fill="#0F172A" font-size="13" font-weight="600">Alex Green</text>
  <text x="590" y="373" fill="#475569" font-size="13">Carpenter Specialist</text>
  <text x="790" y="373" fill="#475569" font-size="13">Estate Maintenance</text>
  <text x="970" y="373" fill="#047857" font-size="13" font-weight="700">1 Active Ticket</text>
  <rect x="1140" y="360" width="85" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1182" y="376" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">Available</text>
  <text x="1290" y="373" fill="#1F4E79" font-size="12" font-weight="600">Inspect</text>

  <!-- Row 3: Mark Wilson -->
  <line x1="300" y1="450" x2="1355" y2="450" stroke="#F1F5F9"/>
  <text x="320" y="428" fill="#1F4E79" font-size="13" font-weight="700" font-family="monospace">STF-08</text>
  <text x="410" y="428" fill="#0F172A" font-size="13" font-weight="600">Mark Wilson</text>
  <text x="590" y="428" fill="#475569" font-size="13">Plumber Specialist</text>
  <text x="790" y="428" fill="#475569" font-size="13">Estate Maintenance</text>
  <text x="970" y="428" fill="#047857" font-size="13" font-weight="700">2 Active Tickets</text>
  <rect x="1140" y="415" width="85" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1182" y="431" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">Available</text>
  <text x="1290" y="428" fill="#1F4E79" font-size="12" font-weight="600">Inspect</text>

  <!-- Row 4: Kevin Carter -->
  <line x1="300" y1="505" x2="1355" y2="505" stroke="#F1F5F9"/>
  <text x="320" y="483" fill="#1F4E79" font-size="13" font-weight="700" font-family="monospace">STF-11</text>
  <text x="410" y="483" fill="#0F172A" font-size="13" font-weight="600">Kevin Carter</text>
  <text x="590" y="483" fill="#475569" font-size="13">Network Systems Engineer</text>
  <text x="790" y="483" fill="#475569" font-size="13">IT Infrastructure</text>
  <text x="970" y="483" fill="#047857" font-size="13" font-weight="700">2 Active Tickets</text>
  <rect x="1140" y="470" width="85" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1182" y="486" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">Available</text>
  <text x="1290" y="483" fill="#1F4E79" font-size="12" font-weight="600">Inspect</text>

</svg>