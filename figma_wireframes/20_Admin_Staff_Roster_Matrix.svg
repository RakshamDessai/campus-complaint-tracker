  <text x="320" y="276" fill="#475569" font-size="11" font-weight="700">STAFF_ID</text>
  <text x="410" y="276" fill="#475569" font-size="11" font-weight="700">FULL NAME</text>
  <text x="590" y="276" fill="#475569" font-size="11" font-weight="700">TRADE / DESIGNATION</text>
  <text x="790" y="276" fill="#475569" font-size="11" font-weight="700">DEPARTMENT</text>
  <text x="970" y="276" fill="#475569" font-size="11" font-weight="700">ACTIVE QUEUE</text>
  <text x="1140" y="276" fill="#475569" font-size="11" font-weight="700">CAPACITY STATUS</text>
  <text x="1270" y="276" fill="#475569" font-size="11" font-weight="700">ACTION</text>

  <!-- Row 1: John Doe -->
