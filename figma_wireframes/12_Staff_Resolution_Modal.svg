<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F4F7FA"/>
  <!-- Sidebar Navigation -->
  <g id="Sidebar">
    <rect x="0" y="0" width="240" height="900" fill="#0F2537"/>
    <!-- Brand / Logo -->
    <rect x="24" y="24" width="36" height="36" rx="8" fill="#1F4E79"/>
    <path d="M34 42L42 34M42 34L50 42M42 34V48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" fill="#FFFFFF" font-size="15" font-weight="700">CAMPUS TRACKER</text>
    <text x="68" y="52" fill="#7E92A2" font-size="11" font-weight="500">STAFF PORTAL</text>
    <line x1="20" y1="72" x2="220" y2="72" stroke="#1E384D" stroke-width="1"/>
    <!-- Active Nav Item -->
    <rect x="12" y="95" width="216" height="40" rx="6" fill="#1F4E79"/>
    <rect x="12" y="95" width="4" height="40" rx="2" fill="#60A5FA"/>
    <text x="36" y="120" fill="#FFFFFF" font-size="13.5" font-weight="600">Work Queue</text>
    <!-- Nav Item -->
    <text x="36" y="168" fill="#A0B0BF" font-size="13.5" font-weight="500">Ticket Action</text>
    <!-- Nav Item -->
    <text x="36" y="216" fill="#A0B0BF" font-size="13.5" font-weight="500">Resolution Log</text>
    <!-- Nav Item -->
    <text x="36" y="264" fill="#A0B0BF" font-size="13.5" font-weight="500">My Performance</text>
    <!-- Nav Item -->
    <text x="36" y="312" fill="#A0B0BF" font-size="13.5" font-weight="500">Profile</text>
    <!-- Bottom Session / Database Info -->
    <rect x="16" y="820" width="208" height="60" rx="8" fill="#183348"/>
    <circle cx="36" cy="850" r="6" fill="#10B981"/>
    <text x="50" y="846" fill="#FFFFFF" font-size="11.5" font-weight="600">DB State Machine</text>
    <text x="50" y="862" fill="#8EA3B5" font-size="10.5">Enforcing 14 FRs &amp; SLAs</text>
  </g>
  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="240" y="0" width="1200" height="70" fill="#FFFFFF"/>
    <line x1="240" y1="70" x2="1440" y2="70" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="272" y="32" fill="#64748B" font-size="11.5" font-weight="500">Home / Portal</text>
    <text x="272" y="52" fill="#0F172A" font-size="18" font-weight="700">Work Queue</text>
    
    <!-- Search Bar -->
    <rect x="720" y="16" width="300" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="740" cy="35" r="5" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="744" y1="39" x2="750" y2="45" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="758" y="39" fill="#94A3B8" font-size="12">Search complaints, tickets, IDs...</text>
    
    <!-- Notification Bell -->
    <circle cx="1060" cy="35" r="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <path d="M1057 32C1057 30 1059 28 1060 28C1061 28 1063 30 1063 32V36L1065 38H1055L1057 36V32Z" stroke="#475569" stroke-width="1.5"/>
    <circle cx="1066" cy="27" r="4" fill="#EF4444"/>
    
    <!-- User Profile Badge -->
    <circle cx="1120" cy="35" r="18" fill="#1F4E79"/>
    <text x="1120" y="40" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">JO</text>
    <text x="1148" y="33" fill="#0F172A" font-size="13" font-weight="600">John Doe</text>
    <rect x="1148" y="40" width="70" height="18" rx="4" fill="#E2E8F0"/>
    <text x="1183" y="53" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">STAFF / ELECTRICIAN (STF-04)</text>
  </g>

  <!-- Dimmed Background Overlay to represent Modal -->
  <rect x="240" y="70" width="1200" height="830" fill="#000000" opacity="0.45"/>

  <!-- Centered Modal Box (680px) -->
  <rect x="500" y="120" width="680" height="680" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  
  <!-- Modal Header -->
  <rect x="500" y="120" width="680" height="65" rx="12" fill="#1F4E79"/>
  <text x="530" y="160" fill="#FFFFFF" font-size="18" font-weight="700">Resolve Complaint #CMP-101 &amp; Document Closure</text>
  <text x="1150" y="160" fill="#FFFFFF" font-size="18" text-anchor="middle">✕</text>

  <!-- Modal Body -->
  <rect x="530" y="210" width="620" height="42" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="545" y="236" fill="#065F46" font-size="12" font-weight="600">✔ Mandatory Requirement (FR6): The database enforces entry of closure remarks before marking Resolved.</text>

  <!-- Complaint Summary Strip -->
  <text x="530" y="280" fill="#64748B" font-size="11.5" font-weight="700">COMPLAINT TITLE</text>
  <text x="530" y="300" fill="#0F172A" font-size="13.5" font-weight="600">Ceiling fan in room 204 making loud grinding noise</text>
  <text x="530" y="318" fill="#64748B" font-size="11.5">Student: Raksham Dessai (24B-CO-019) • Nilkanth Hostel 204</text>

  <!-- Form Fields -->
  <text x="530" y="355" fill="#334155" font-size="12" font-weight="700">TECHNICAL RESOLUTION SUMMARY (MANDATORY REMARKS) *</text>
  <rect x="530" y="365" width="620" height="95" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="545" y="390" fill="#0F172A" font-size="13">Dismounted fan motor assembly. Replaced damaged 6202 bearing, lubricated rotor shaft, and balanced blade brackets. Motor tested on high speed for 15 minutes; sound level normal, zero vibrations.</text>

  <!-- Parts Replaced -->
  <text x="530" y="485" fill="#334155" font-size="12" font-weight="700">PARTS / MATERIALS REPLACED FROM INVENTORY</text>
  <rect x="530" y="495" width="620" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="545" y="521" fill="#0F172A" font-size="13">1x SKF 6202 deep groove ball bearing, 1x rubber mounting washer</text>

  <!-- Time Taken -->
  <text x="530" y="560" fill="#334155" font-size="12" font-weight="700">TIME SPENT ON REPAIR</text>
  <rect x="530" y="570" width="290" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="545" y="596" fill="#0F172A" font-size="13">45 Minutes</text>

  <text x="860" y="560" fill="#334155" font-size="12" font-weight="700">CLOSURE TIMESTAMP</text>
  <rect x="860" y="570" width="290" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="875" y="596" fill="#475569" font-size="13">Oct 16, 2026, 11:30 AM (AUTO)</text>

  <!-- Resolution Photo Upload -->
  <rect x="530" y="630" width="620" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/>
  <text x="840" y="660" fill="#64748B" font-size="12" text-anchor="middle">📷 Upload photo of fixed fixture (e.g. repaired fan running)</text>

  <!-- Modal Actions -->
  <line x1="500" y1="700" x2="1180" y2="700" stroke="#E2E8F0"/>
  <rect x="530" y="720" width="280" height="46" rx="8" fill="#10B981"/>
  <text x="670" y="748" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">✔ Confirm &amp; Mark 'Resolved' →</text>
  
  <rect x="830" y="720" width="110" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="885" y="748" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>

</svg>