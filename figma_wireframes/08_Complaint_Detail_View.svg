<rect x="300" y="220" width="82" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A"/>
<text x="341.0" y="236" fill="#B45309" font-size="11" font-weight="600" text-anchor="middle">In-Progress</text>
