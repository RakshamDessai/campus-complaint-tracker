<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F4F7FA"/>

  <!-- Background Header Gradient Banner -->
  <rect x="0" y="0" width="1440" height="340" fill="#0F2537"/>
  <rect x="120" y="40" width="36" height="36" rx="8" fill="#1F4E79"/>
  <text x="170" y="63" fill="#FFFFFF" font-size="17" font-weight="700">CAMPUS TRACKER</text>
  <text x="170" y="79" fill="#94A3B8" font-size="11.5">Staff, Warden &amp; Admin Sign-In</text>

  <!-- Main Card Centered -->
  <rect x="470" y="160" width="500" height="640" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <text x="510" y="215" fill="#0F172A" font-size="22" font-weight="800">Authorized Personnel Login</text>
  <text x="510" y="240" fill="#64748B" font-size="13">Access restricted by database role-based security views.</text>
  
  <!-- Role Selector Radio Pill -->
  <text x="510" y="285" fill="#334155" font-size="12" font-weight="600">SELECT YOUR OFFICIAL ROLE *</text>
  
  <!-- 3 Role Options -->
  <rect x="510" y="295" width="135" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="577" y="320" fill="#1D4ED8" font-size="12" font-weight="700" text-anchor="middle">🔧 Technician</text>
  
  <rect x="655" y="295" width="140" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="725" y="320" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">🏢 Hostel Warden</text>
  
  <rect x="805" y="295" width="125" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="867" y="320" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">📊 Admin</text>

  <!-- Inputs -->
  <text x="510" y="375" fill="#334155" font-size="12" font-weight="600">STAFF / EMPLOYEE ID (PK) *</text>
  <rect x="510" y="385" width="420" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="528" y="412" fill="#0F172A" font-size="13.5" font-family="monospace">STF-04</text>

  <text x="510" y="460" fill="#334155" font-size="12" font-weight="600">PARENT DEPARTMENT (Dept_ID) *</text>
  <rect x="510" y="470" width="420" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="528" y="497" fill="#0F172A" font-size="13">DEP-01 • Estate &amp; Maintenance</text>
  <path d="M905 489L912 496L919 489" stroke="#64748B" stroke-width="1.8"/>

  <text x="510" y="545" fill="#334155" font-size="12" font-weight="600">PORTAL PASSWORD *</text>
  <rect x="510" y="555" width="420" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="528" y="582" fill="#0F172A" font-size="13">••••••••••••••••</text>
  
  <!-- Remember Me & Forgot Password -->
  <rect x="510" y="618" width="16" height="16" rx="4" fill="#1F4E79"/>
  <path d="M513 626L517 630L523 622" stroke="#FFFFFF" stroke-width="2"/>
  <text x="535" y="631" fill="#475569" font-size="12">Keep authenticated on this station</text>
  <text x="930" y="631" fill="#1F4E79" font-size="12" font-weight="600" text-anchor="end">Forgot Password?</text>

  <!-- Submit Button -->
  <rect x="510" y="665" width="420" height="48" rx="8" fill="#1F4E79"/>
  <text x="720" y="695" fill="#FFFFFF" font-size="14.5" font-weight="700" text-anchor="middle">Authorize &amp; Access Dashboard →</text>
  
  <!-- Info banner below -->
  <rect x="510" y="735" width="420" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="720" y="758" fill="#64748B" font-size="11.5" text-anchor="middle">🛡 Enforced via SQL Row-Level Views &amp; Triggers</text>

</svg>