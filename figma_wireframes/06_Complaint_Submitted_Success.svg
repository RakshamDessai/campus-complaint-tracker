  <rect x="470" y="320" width="720" height="280" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  
  <!-- Row 1 -->
  <text x="500" y="355" fill="#64748B" font-size="12" font-weight="600">TICKET REFERENCE ID</text>
  <text x="500" y="382" fill="#1F4E79" font-size="20" font-weight="800" font-family="monospace">#CMP-104</text>
  
  <text x="860" y="355" fill="#64748B" font-size="12" font-weight="600">CURRENT DATABASE STATUS</text>
<rect x="860" y="365" width="82" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="901.0" y="381" fill="#1D4ED8" font-size="11" font-weight="600" text-anchor="middle">Open</text>
  <line x1="500" y1="410" x2="1140" y2="410" stroke="#E2E8F0"/>

  <!-- Row 2 -->
  <text x="500" y="440" fill="#64748B" font-size="12" font-weight="600">COMPLAINT CATEGORY</text>
  <text x="500" y="465" fill="#0F172A" font-size="14" font-weight="600">Hostel Maintenance (Estate Dept)</text>
  
  <text x="860" y="440" fill="#64748B" font-size="12" font-weight="600">AUTOMATIC SLA ESCALATION TARGET</text>
  <text x="860" y="465" fill="#B45309" font-size="14" font-weight="700">October 20, 2026 (72 Hours Remaining)</text>
  
  <line x1="500" y1="495" x2="1140" y2="495" stroke="#E2E8F0"/>

  <!-- Row 3 -->
  <text x="500" y="525" fill="#64748B" font-size="12" font-weight="600">ASSIGNED RECIPIENT</text>
  <text x="500" y="550" fill="#0F172A" font-size="14">Warden Queue: Nilkanth Hostel (Dr. Ramesh Sharma)</text>
  
  <text x="860" y="525" fill="#64748B" font-size="12" font-weight="600">AUDIT LOG INITIALIZED</text>
  <text x="860" y="550" fill="#047857" font-size="13" font-family="monospace">StatusHistory(History_Num = 1)</text>

  <!-- CTA Buttons -->
  <rect x="470" y="630" width="345" height="48" rx="8" fill="#1F4E79"/>
  <text x="642" y="660" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Track Live Step Timeline →</text>
  
  <rect x="845" y="630" width="345" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1017" y="660" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Return to Student Dashboard</text>
  
  <text x="830" y="730" fill="#94A3B8" font-size="11.5" text-anchor="middle">Automated triggers will log every subsequent status update automatically.</text>

</svg>