  <circle cx="830" cy="190" r="32" fill="#10B981"/>
  <path d="M818 190L826 198L842 182" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="830" y="260" fill="#0F172A" font-size="24" font-weight="800" text-anchor="middle">Grievance Successfully Filed &amp; Logged!</text>
  <text x="830" y="285" fill="#64748B" font-size="14" text-anchor="middle">Your complaint has been recorded into the centralized database with an initialized audit trail.</text>

