<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F4F7FA"/>
  <!-- Sidebar Navigation -->
  <g id="Sidebar">
    <rect x="0" y="0" width="240" height="900" fill="#0F2537"/>
    <!-- Brand / Logo -->
    <rect x="24" y="24" width="36" height="36" rx="8" fill="#1F4E79"/>
    <path d="M34 42L42 34M42 34L50 42M42 34V48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" fill="#FFFFFF" font-size="15" font-weight="700">CAMPUS TRACKER</text>
    <text x="68" y="52" fill="#7E92A2" font-size="11" font-weight="500">STUDENT PORTAL</text>
    <line x1="20" y1="72" x2="220" y2="72" stroke="#1E384D" stroke-width="1"/>
    <!-- Nav Item -->
    <text x="36" y="120" fill="#A0B0BF" font-size="13.5" font-weight="500">Dashboard</text>
    <!-- Active Nav Item -->
    <rect x="12" y="143" width="216" height="40" rx="6" fill="#1F4E79"/>
    <rect x="12" y="143" width="4" height="40" rx="2" fill="#60A5FA"/>
    <text x="36" y="168" fill="#FFFFFF" font-size="13.5" font-weight="600">File Complaint</text>
    <!-- Nav Item -->
    <text x="36" y="216" fill="#A0B0BF" font-size="13.5" font-weight="500">My Complaints</text>
    <!-- Nav Item -->
    <text x="36" y="264" fill="#A0B0BF" font-size="13.5" font-weight="500">Live Timeline</text>
    <!-- Nav Item -->
    <text x="36" y="312" fill="#A0B0BF" font-size="13.5" font-weight="500">My Profile</text>
    <!-- Bottom Session / Database Info -->
    <rect x="16" y="820" width="208" height="60" rx="8" fill="#183348"/>
    <circle cx="36" cy="850" r="6" fill="#10B981"/>
    <text x="50" y="846" fill="#FFFFFF" font-size="11.5" font-weight="600">DB State Machine</text>
    <text x="50" y="862" fill="#8EA3B5" font-size="10.5">Enforcing 14 FRs &amp; SLAs</text>
  </g>
  <!-- Top Navigation Bar -->
  <g id="TopBar">
    <rect x="240" y="0" width="1200" height="70" fill="#FFFFFF"/>
    <line x1="240" y1="70" x2="1440" y2="70" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="272" y="32" fill="#64748B" font-size="11.5" font-weight="500">Home / Portal</text>
    <text x="272" y="52" fill="#0F172A" font-size="18" font-weight="700">Submit New Grievance</text>
    
    <!-- Search Bar -->
    <rect x="720" y="16" width="300" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="740" cy="35" r="5" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="744" y1="39" x2="750" y2="45" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="758" y="39" fill="#94A3B8" font-size="12">Search complaints, tickets, IDs...</text>
    
    <!-- Notification Bell -->
    <circle cx="1060" cy="35" r="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <path d="M1057 32C1057 30 1059 28 1060 28C1061 28 1063 30 1063 32V36L1065 38H1055L1057 36V32Z" stroke="#475569" stroke-width="1.5"/>
    <circle cx="1066" cy="27" r="4" fill="#EF4444"/>
    
    <!-- User Profile Badge -->
    <circle cx="1120" cy="35" r="18" fill="#1F4E79"/>
    <text x="1120" y="40" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">RA</text>
    <text x="1148" y="33" fill="#0F172A" font-size="13" font-weight="600">Raksham Dessai</text>
    <rect x="1148" y="40" width="70" height="18" rx="4" fill="#E2E8F0"/>
    <text x="1183" y="53" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">STUDENT (24B-CO-019)</text>
  </g>

  <!-- Main Form Card -->
  <rect x="270" y="95" width="1115" height="750" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <text x="310" y="140" fill="#0F172A" font-size="20" font-weight="800">File a Formal Campus Grievance (FR2)</text>
  <text x="310" y="162" fill="#64748B" font-size="13">Select category, describe the issue, and initiate an immutable tracking record in <tspan font-family="monospace">Complaint</tspan>.</text>
  <line x1="310" y1="180" x2="1340" y2="180" stroke="#E2E8F0"/>

  <!-- Category Selection -->
  <text x="310" y="215" fill="#334155" font-size="12" font-weight="700">COMPLAINT CATEGORY (FK -> Category.Category_ID) *</text>
  <rect x="310" y="225" width="500" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="252" fill="#0F172A" font-size="13.5">Hostel Maintenance (CAT-01)</text>
  <path d="M785 244L792 251L799 244" stroke="#64748B" stroke-width="1.8"/>

  <!-- Dynamic SLA Callout Banner -->
  <rect x="835" y="225" width="485" height="44" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="855" cy="247" r="10" fill="#3B82F6"/>
  <text x="855" y="251" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">i</text>
  <text x="875" y="252" fill="#1E40AF" font-size="12.5" font-weight="600">Category SLA: 3 Days maximum resolution window (Hostel Office)</text>

  <!-- Location Confirmation (Pre-populated from Student) -->
  <text x="310" y="305" fill="#334155" font-size="12" font-weight="700">RESIDENTIAL LOCATION (DERIVED FROM STUDENT -> HOSTEL)</text>
  <rect x="310" y="315" width="500" height="42" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="330" y="341" fill="#475569" font-size="13">Nilkanth Hostel • Room 204 (Auto-populated to avoid 3NF violation)</text>

  <text x="835" y="305" fill="#334155" font-size="12" font-weight="700">SPECIFIC SUB-LOCATION / FIXTURE</text>
  <rect x="835" y="315" width="485" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="855" y="341" fill="#0F172A" font-size="13">Ceiling Fan (Left Side above Study Desk)</text>

  <!-- Complaint Title -->
  <text x="310" y="395" fill="#334155" font-size="12" font-weight="700">SUMMARY TITLE *</text>
  <rect x="310" y="405" width="1010" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="431" fill="#0F172A" font-size="13.5">Ceiling fan in room 204 making loud grinding noise and vibrating dangerously</text>

  <!-- Detailed Description -->
  <text x="310" y="480" fill="#334155" font-size="12" font-weight="700">DETAILED DESCRIPTION (Description TEXT) *</text>
  <rect x="310" y="490" width="1010" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="515" fill="#0F172A" font-size="13">The ceiling fan bearing started making severe metal grinding noise yesterday night. At regulator speed 3 or higher, the whole mounting rod shakes noticeably. Needs immediate bearing replacement or tightening before it falls.</text>

  <!-- Photo Attachment Upload Box -->
  <text x="310" y="630" fill="#334155" font-size="12" font-weight="700">EVIDENCE PHOTO OR AUDIO ATTACHMENT [OPTIONAL]</text>
  <rect x="310" y="640" width="1010" height="75" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <path d="M815 670L815 660M815 660L810 665M815 660L820 665" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <text x="815" y="688" fill="#475569" font-size="12.5" font-weight="600" text-anchor="middle">Drag &amp; drop picture of broken fixture or <tspan fill="#1F4E79" font-weight="700">browse file</tspan></text>
  <text x="815" y="704" fill="#94A3B8" font-size="11" text-anchor="middle">JPG, PNG, or MP4 up to 10MB</text>

  <!-- Submit & Cancel Buttons -->
  <line x1="310" y1="735" x2="1320" y2="735" stroke="#E2E8F0"/>
  <rect x="310" y="755" width="260" height="44" rx="8" fill="#1F4E79"/>
  <text x="440" y="782" fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle">Submit Grievance to Queue →</text>
  
  <rect x="590" y="755" width="110" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="645" y="782" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
  
  <text x="1320" y="782" fill="#64748B" font-size="12" text-anchor="end">Status will initialize as: <tspan fill="#1D4ED8" font-weight="700">'Open'</tspan> with audit record logged</text>

</svg>